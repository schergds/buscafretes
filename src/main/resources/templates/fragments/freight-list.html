<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="list" id="freight-list-container">
    <div th:if="${freights.empty}" class="text-center py-5">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <h3 class="mt-3 text-muted">Nenhum frete encontrado</h3>
        <p>Tente ajustar seus filtros de busca.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="freight : ${freights.content}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge badge-tipo" th:text="${freight.tipoCaminhao.descricao}">Truck</span>
                        <span class="freight-price" th:text="${'R$ ' + #numbers.formatDecimal(freight.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                    </div>
                    <h5 class="card-title fw-bold" th:text="${freight.titulo}">Título</h5>
                    
                    <div class="mt-3">
                        <p class="mb-1 text-muted small"><i class="bi bi-geo-alt"></i> <strong>Origem:</strong> <span th:text="${freight.origem}"></span></p>
                        <p class="mb-1 text-muted small"><i class="bi bi-geo-fill"></i> <strong>Destino:</strong> <span th:text="${freight.destino}"></span></p>
                        <p class="mb-1 text-muted small"><i class="bi bi-calendar"></i> <strong>Coleta:</strong> <span th:text="${#temporals.format(freight.dataColeta, 'dd/MM/yyyy')}"></span></p>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top-0 pb-3 px-3">
                    <a th:href="@{/freights/{id}(id=${freight.id})}" class="btn btn-outline-primary w-100">Ver Detalhes</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Paginação -->
    <nav class="mt-5" th:if="${freights.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${freights.first ? 'disabled' : ''}">
                <a class="page-link" href="#"
                   th:attr="hx-get=@{/(page=${freights.number - 1},origem=${origem},destino=${destino},tipoCaminhao=${tipoCaminhaoSel})}"
                   hx-target="#freight-list-container" hx-swap="outerHTML">Anterior</a>
            </li>
            
            <li class="page-item" th:each="i : ${#numbers.sequence(0, freights.totalPages - 1)}"
                th:classappend="${freights.number == i ? 'active' : ''}">
                <a class="page-link" href="#"
                   th:attr="hx-get=@{/(page=${i},origem=${origem},destino=${destino},tipoCaminhao=${tipoCaminhaoSel})}"
                   hx-target="#freight-list-container" hx-swap="outerHTML" th:text="${i + 1}">1</a>
            </li>
            
            <li class="page-item" th:classappend="${freights.last ? 'disabled' : ''}">
                <a class="page-link" href="#"
                   th:attr="hx-get=@{/(page=${freights.number + 1},origem=${origem},destino=${destino},tipoCaminhao=${tipoCaminhaoSel})}"
                   hx-target="#freight-list-container" hx-swap="outerHTML">Próxima</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
