<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Entrar - Vitrine de Fretes</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Bem-vindo de volta</h3>
                    <p class="text-muted">Acesse sua conta para continuar</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger">
                    E-mail ou senha inválidos.
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    Você saiu com sucesso.
                </div>
                <div th:if="${param.registered}" class="alert alert-success">
                    Cadastro realizado com sucesso! Faça login.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" name="email" class="form-control" required autofocus placeholder="seu@email.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Senha</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar</button>
                </form>
                
                <div class="mt-4 text-center">
                    <p class="text-muted">Ainda não tem conta? <a th:href="@{/register}" class="text-decoration-none fw-bold">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
