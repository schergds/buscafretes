<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>BuscaFretes</title>
</head>
<body>
<div layout:fragment="content">

    <div class="hero-section d-flex flex-column flex-lg-row align-items-center justify-content-between px-4 py-4">
        <div class="text-center text-lg-start mb-4 mb-lg-0">
            <h1 class="hero-title mb-2">Encontre fretes em todo Brasil</h1>
            <p class="hero-subtitle mb-0">Publique cargas ou encontre motoristas de forma rápida e simples.</p>
        </div>
        <div class="d-flex flex-column flex-sm-row gap-3">
            <a th:href="@{/freights/create}" class="btn btn-light btn-lg fw-bold px-4">Publicar Frete</a>
        </div>
    </div>

    <div class="row">
        <!-- Sidebar Filters -->
        <div class="col-lg-3 mb-4">
            <div class="card shadow-sm sticky-top" style="top: 100px; z-index: 1;">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-4"><i class="bi bi-funnel"></i> Filtros</h5>
                    
                    <form hx-get="/" hx-target="#freight-list-container" hx-swap="outerHTML" hx-push-url="true">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Origem</label>
                            <input type="text" name="origem" class="form-control" placeholder="Ex: São Paulo" th:value="${origem}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Destino</label>
                            <input type="text" name="destino" class="form-control" placeholder="Ex: Rio de Janeiro" th:value="${destino}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Tipo de Caminhão</label>
                            <select name="tipoCaminhao" class="form-select">
                                <option value="">Todos</option>
                                <option th:each="tipo : ${tiposCaminhao}" 
                                        th:value="${tipo}" 
                                        th:text="${tipo.descricao}"
                                        th:selected="${tipo == tipoCaminhaoSel}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            Buscar <span class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Fretes Disponíveis</h3>
                <span class="text-muted" th:text="${freights.totalElements + ' fretes encontrados'}">0</span>
            </div>

            <!-- HTMX List Fragment Injection -->
            <div th:replace="~{fragments/freight-list :: list}"></div>

        </div>
    </div>

</div>
</body>
</html>
