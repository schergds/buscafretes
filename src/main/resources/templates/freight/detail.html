<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>Detalhes do Frete - Vitrine de Fretes</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-3">
                <a th:href="@{/}" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Voltar para lista</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge badge-tipo fs-6" th:text="${freight.tipoCaminhao.descricao}">Truck</span>
                        <span class="freight-price fs-3" th:text="${'R$ ' + #numbers.formatDecimal(freight.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                    </div>

                    <h1 class="fw-bold mb-4" th:text="${freight.titulo}">Título</h1>
                    
                    <p class="text-muted mb-5" th:text="${freight.descricao}" style="white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6;">Descrição longa aqui.</p>

                    <h4 class="fw-bold mb-3 border-bottom pb-2">Informações da Carga</h4>
                    <div class="row mb-5">
                        <div class="col-md-6 mb-3">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-geo-alt fs-4 text-primary me-3"></i>
                                <div>
                                    <p class="text-muted small mb-0">Origem</p>
                                    <p class="fw-bold mb-0" th:text="${freight.origem}"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-geo-fill fs-4 text-primary me-3"></i>
                                <div>
                                    <p class="text-muted small mb-0">Destino</p>
                                    <p class="fw-bold mb-0" th:text="${freight.destino}"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-calendar-event fs-4 text-primary me-3"></i>
                                <div>
                                    <p class="text-muted small mb-0">Data de Coleta</p>
                                    <p class="fw-bold mb-0" th:text="${#temporals.format(freight.dataColeta, 'dd/MM/yyyy')}"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-box-seam fs-4 text-primary me-3"></i>
                                <div>
                                    <p class="text-muted small mb-0">Peso / Dimensões</p>
                                    <p class="fw-bold mb-0" th:text="${freight.peso != null && !freight.peso.isEmpty() ? freight.peso : 'Não informado'}"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-light p-4 rounded-3 text-center">
                        <h5 class="fw-bold mb-3">Interessado neste frete?</h5>
                        <p class="text-muted mb-4">Entre em contato direto com o anunciante.</p>
                        
                        <div class="d-flex justify-content-center gap-3 flex-wrap">
                            <a th:href="${'https://wa.me/' + freight.whatsapp + '?text=Olá, vi seu anúncio no Vitrine de Fretes: ' + freight.titulo}" 
                               target="_blank" class="btn btn-success btn-lg px-4">
                                <i class="bi bi-whatsapp"></i> Chamar no WhatsApp
                            </a>
                            <a th:href="${'tel:' + freight.telefoneContato}" class="btn btn-outline-secondary btn-lg px-4">
                                <i class="bi bi-telephone"></i> <span th:text="${freight.telefoneContato}"></span>
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
