spring.application.name=buscafretes

spring.datasource.url=jdbc:postgresql://localhost:5433/buscafretes
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Habilitar logs detalhados para o Spring Framework
logging.level.org.springframework=DEBUG

# Habilitar logs detalhados para o Spring Security (opcional, se necessário)
logging.level.org.springframework.security=DEBUG
